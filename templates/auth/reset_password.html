{% extends "base.html" %}

{% block title %}Reset Password - Quiz App{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <div class="mx-auto h-12 w-12 flex items-center justify-center rounded-full bg-purple-100">
                <span class="text-2xl">🔑</span>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Reset Your Password
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Enter your new password below
            </p>
        </div>

        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
            <form id="reset-password-form" class="space-y-6">
                <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded"></div>
                <div id="success-message" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded"></div>

                <input type="hidden" id="token" value="{{ token }}">

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">
                        New Password
                    </label>
                    <div class="mt-1 relative">
                        <input id="password" name="password" type="password" required
                               minlength="8"
                               pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?&quot;:{}|&lt;&gt;]).{8,}$"
                               title="Password must be at least 8 characters with uppercase, lowercase, number, and special character"
                               class="appearance-none block w-full px-3 py-2 pr-10 border border-gray-300 rounded-md placeholder-gray-400 focus:outline-none focus:ring-purple-500 focus:border-purple-500 sm:text-sm"
                               placeholder="Create a strong password"
                               oninput="checkPasswordStrength()">
                        <button type="button" onclick="togglePasswordVisibility('password', 'password-eye')"
                                class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <svg id="password-eye" class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                    <div id="password-strength" class="mt-2 hidden">
                        <div class="flex gap-1 mb-1">
                            <div id="strength-bar-1" class="h-1 flex-1 bg-gray-200 rounded"></div>
                            <div id="strength-bar-2" class="h-1 flex-1 bg-gray-200 rounded"></div>
                            <div id="strength-bar-3" class="h-1 flex-1 bg-gray-200 rounded"></div>
                            <div id="strength-bar-4" class="h-1 flex-1 bg-gray-200 rounded"></div>
                        </div>
                        <p id="strength-text" class="text-xs"></p>
                    </div>
                    <div class="mt-1 text-xs text-gray-600 space-y-1">
                        <p id="req-length" class="flex items-center"><span class="mr-1">⚪</span> At least 8 characters</p>
                        <p id="req-upper" class="flex items-center"><span class="mr-1">⚪</span> One uppercase letter</p>
                        <p id="req-lower" class="flex items-center"><span class="mr-1">⚪</span> One lowercase letter</p>
                        <p id="req-number" class="flex items-center"><span class="mr-1">⚪</span> One number</p>
                        <p id="req-special" class="flex items-center"><span class="mr-1">⚪</span> One special character</p>
                    </div>
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-gray-700">
                        Confirm New Password
                    </label>
                    <div class="mt-1 relative">
                        <input id="confirm_password" name="confirm_password" type="password" required
                               class="appearance-none block w-full px-3 py-2 pr-10 border border-gray-300 rounded-md placeholder-gray-400 focus:outline-none focus:ring-purple-500 focus:border-purple-500 sm:text-sm"
                               placeholder="Confirm your password">
                        <button type="button" onclick="togglePasswordVisibility('confirm_password', 'confirm-password-eye')"
                                class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <svg id="confirm-password-eye" class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div>
                    <button type="submit"
                            class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500">
                        Reset Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);

    if (input.type === 'password') {
        input.type = 'text';
        // Change to "eye-off" icon (crossed out eye)
        icon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
        `;
    } else {
        input.type = 'password';
        // Change back to regular "eye" icon
        icon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        `;
    }
}

// Password strength checker (same as registration)
function checkPasswordStrength() {
    const password = document.getElementById('password').value;
    const strengthDiv = document.getElementById('password-strength');
    const strengthText = document.getElementById('strength-text');

    const hasLength = password.length >= 8;
    const hasUpper = /[A-Z]/.test(password);
    const hasLower = /[a-z]/.test(password);
    const hasNumber = /\d/.test(password);
    const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);

    updateRequirement('req-length', hasLength);
    updateRequirement('req-upper', hasUpper);
    updateRequirement('req-lower', hasLower);
    updateRequirement('req-number', hasNumber);
    updateRequirement('req-special', hasSpecial);

    let strength = 0;
    if (hasLength) strength++;
    if (hasUpper) strength++;
    if (hasLower) strength++;
    if (hasNumber) strength++;
    if (hasSpecial) strength++;

    if (password.length > 0) {
        strengthDiv.classList.remove('hidden');
    } else {
        strengthDiv.classList.add('hidden');
        return;
    }

    const bars = [
        document.getElementById('strength-bar-1'),
        document.getElementById('strength-bar-2'),
        document.getElementById('strength-bar-3'),
        document.getElementById('strength-bar-4')
    ];

    bars.forEach(bar => bar.className = 'h-1 flex-1 bg-gray-200 rounded');

    if (strength >= 1) {
        bars[0].className = 'h-1 flex-1 bg-red-500 rounded';
        strengthText.textContent = 'Weak password';
        strengthText.className = 'text-xs text-red-600 font-medium';
    }
    if (strength >= 2) {
        bars[1].className = 'h-1 flex-1 bg-orange-500 rounded';
        strengthText.textContent = 'Fair password';
        strengthText.className = 'text-xs text-orange-600 font-medium';
    }
    if (strength >= 3) {
        bars[2].className = 'h-1 flex-1 bg-yellow-500 rounded';
        strengthText.textContent = 'Good password';
        strengthText.className = 'text-xs text-yellow-600 font-medium';
    }
    if (strength >= 5) {
        bars[3].className = 'h-1 flex-1 bg-green-500 rounded';
        strengthText.textContent = 'Strong password!';
        strengthText.className = 'text-xs text-green-600 font-medium';
    }
}

function updateRequirement(elementId, isMet) {
    const element = document.getElementById(elementId);
    const span = element.querySelector('span');
    if (isMet) {
        span.textContent = '✅';
        element.classList.add('text-green-600');
        element.classList.remove('text-gray-600');
    } else {
        span.textContent = '⚪';
        element.classList.add('text-gray-600');
        element.classList.remove('text-green-600');
    }
}

document.getElementById('reset-password-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const errorDiv = document.getElementById('error-message');
    const successDiv = document.getElementById('success-message');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    errorDiv.classList.add('hidden');
    successDiv.classList.add('hidden');

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const token = document.getElementById('token').value;

    // Validate password match
    if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.classList.remove('hidden');
        return;
    }

    // Validate password strength
    if (password.length < 8) {
        errorDiv.textContent = 'Password must be at least 8 characters long';
        errorDiv.classList.remove('hidden');
        return;
    }

    // Disable submit button
    submitBtn.disabled = true;
    submitBtn.textContent = 'Resetting...';

    try {
        const response = await fetch(`/reset-password/${token}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ password: password })
        });

        const result = await response.json();

        if (response.ok) {
            successDiv.textContent = result.message + ' Redirecting to login...';
            successDiv.classList.remove('hidden');
            setTimeout(() => {
                window.location.href = '/login';
            }, 2000);
        } else {
            errorDiv.textContent = result.error;
            errorDiv.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Reset Password';
        }
    } catch (error) {
        errorDiv.textContent = 'An error occurred. Please try again.';
        errorDiv.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
    }
});
</script>
{% endblock %}
